<!DOCTYPE html>

<head>

  <title>Dakhilaa — Mains Dashboard</title>
  <link rel="stylesheet" href="../assets/css/styles.css"/>

        <a class="btn-big btn-primary" href="pricing.html?plan=mains">Manage Plan</a>

    <div class="plan-card">
      <strong>Included:</strong> 10,000 Mains questions · 30 chapter tests
